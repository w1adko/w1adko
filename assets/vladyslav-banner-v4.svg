<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
<title id="title">Vladyslav Tkachuk — Software Engineer</title><desc id="desc">Think. Architect. Build. Dark violet developer banner with an elegant terminal, technology labels and a small cats easter egg.</desc>
